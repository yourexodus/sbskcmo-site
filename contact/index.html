<!DOCTYPE html>
<html lang="en-US">
<head>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact – Small Business Solutions</title>

<base href="https://yourexodus.github.io/sbskcmo-site/">

<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700|Montserrat:700&display=fallback">

<style>

/* =========================
   BASE PAGE
========================= */
body {
  margin: 0;
  font-family: 'Noto Sans', sans-serif;
  min-height: 100vh;
  color: #000;
  position: relative;
}

/* Cinematic background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url('assets/LincolnMemorial.png') center/cover no-repeat;
  z-index: -1;
}

/* =========================
   HEADER
========================= */
.site-header {
  background: #fff;
  border-bottom: 1px solid #eee;
  padding: 15px 20px;
}

.site-branding {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1240px;
  margin: auto;
  flex-wrap: wrap;
  gap: 10px;
}

.main-nav {
  max-width: 1240px;
  margin: 10px auto 0;
}

.main-nav a {
  margin-right: 15px;
  text-decoration: none;
  color: #000;
  font-size: 14px;
}

/* =========================
   CENTER LAYOUT
========================= */
.page-wrap {
  min-height: calc(100vh - 160px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
}

/* =========================
   CARD CONTAINER
========================= */
.contact-card {
  background: #fff;
  width: 100%;
  max-width: 650px;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

/* Title */
.contact-card h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: 34px;
  margin-bottom: 25px;
}

/* =========================
   FORM
========================= */
.wpcf7-form label {
  display: block;
  font-weight: 600;
  margin-top: 15px;
  font-size: 14px;
}

.wpcf7-form input,
.wpcf7-form textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
}

.wpcf7-form textarea {
  min-height: 140px;
  resize: vertical;
}

.wpcf7-submit {
  margin-top: 20px;
  width: 100%;
  background: #111;
  color: #fff;
  padding: 12px 30px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-size: 15px;
}

.wpcf7-submit:hover {
  opacity: 0.9;
}

/* =========================
   FOOTER
========================= */
.site-footer {
  text-align: center;
  padding: 25px;
  background: #111;
  color: #fff;
  font-size: 13px;
}

</style>

</head>

<body>

<header class="site-header">

  <div class="site-branding">
    <a href="">
      <img src="wp-content/uploads/2019/11/cropped-logo-126x118.png" style="max-width:120px;">
    </a>

    <div>
      <h2 style="margin:0;">Small Business Solutions</h2>
      <p style="margin:5px 0 0; font-size:13px;">
        Experts in Data Collection, Report Generation, and Sales Training
      </p>
    </div>
  </div>

  <nav class="main-nav">
    <a href="">Home</a>
    <a href="about/">About</a>
    <a href="services/">Services</a>
    <a href="projects/">Projects</a>
    <a href="who-we-are/">Who We Are</a>
    <a href="contact/">Contact</a>
  </nav>

</header>

<div class="page-wrap">

  <div class="contact-card">

    <h1>Contact</h1>

    <form action="https://formspree.io/f/mvzjdzgk" method="POST" class="wpcf7-form">

      <label>Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Subject</label>
      <input type="text" name="subject">

      <label>Message</label>
      <textarea name="message" required></textarea>
      <div class="g-recaptcha" data-sitekey="6LeZay0sAAAAAEG_q2vfplYA9g6LoLsNRMhFZRg3"></div>
      <button type="submit" class="wpcf7-submit">Send Message</button>

    </form>

  </div>

</div>

<footer class="site-footer">
  <p>Overland Park, KS, USA | contactus@sbskcmo.com</p>
  <p>© 2026 Small Business Solutions</p>
</footer>
