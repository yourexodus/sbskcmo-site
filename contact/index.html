<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact – Small Business Solutions</title>

<base href="https://yourexodus.github.io/sbskcmo-site/">

<link rel="stylesheet" href="wp-content/themes/astra/assets/css/minified/style.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700|Montserrat:700&display=fallback">

<style>
/* =========================
   BASE (Astra-like reset)
========================= */
body {
  margin: 0;
  font-family: 'Noto Sans', sans-serif;
  color: #000;
  background-color: #000;
  background-image:
    linear-gradient(to right, #000000, #000000),
    url('assets/LincolnMemorial.png');
  background-size: cover;
  background-position: center;
  background-attachment: scroll;
}

/* =========================
   HEADER (Astra-style light bar)
========================= */
.site-header {
  background: #fff;
  border-bottom: 1px solid #eee;
  padding: 15px 20px;
}

.site-branding {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1240px;
  margin: auto;
}

.site-title {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
}

.main-nav a {
  margin-left: 15px;
  text-decoration: none;
  color: #000;
  font-size: 14px;
}

/* =========================
   CONTAINER (Astra core behavior)
========================= */
.ast-container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 40px 20px;
}

/* =========================
   PAGE CONTENT BOX
========================= */
.site-content {
  background: transparent;
}

/* Title styling (Astra-like) */
h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: 40px;
  margin-bottom: 30px;
  color: #000;
}

/* =========================
   CONTACT FORM (CF7 match)
========================= */
.wpcf7-form {
  background: transparent;
}

.wpcf7-form label {
  display: block;
  font-weight: 600;
  margin-top: 15px;
}

.wpcf7-form input,
.wpcf7-form textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ddd;
  background: #fff;
  color: #000;
  font-family: inherit;
  font-size: 14px;
}

.wpcf7-form textarea {
  min-height: 140px;
  resize: vertical;
}

/* Submit button (Astra-style button) */
.wpcf7-submit {
  margin-top: 15px;
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 10px 35px;
  border: none;
  border-radius: 60px;
  cursor: pointer;
}

.wpcf7-submit:hover {
  background: #000;
}

/* =========================
   FOOTER (match original feel)
========================= */
.site-footer {
  background: #111;
  color: #ccc;
  padding: 25px 20px;
  margin-top: 60px;
  font-size: 14px;
  text-align: center;
}
</style>
</style>

</head>

<body>

<div id="page">

<header class="site-header">
  <div class="site-branding">
    <a href="">
      <img src="wp-content/uploads/2019/11/cropped-logo-126x118.png" style="max-width:120px;">
    </a>

    <div>
      <h2>Small Business Solutions</h2>
      <p>Experts in Data Collection, Report Generation, and Sales Training</p>
    </div>
  </div>

  <nav class="main-nav">
    <a href="">Home</a>
    <a href="about/">About</a>
    <a href="services/">Services</a>
    <a href="projects/">Projects</a>
    <a href="who-we-are/">Who We Are</a>
    <a href="contact/">Contact</a>
  </nav>
</header>

<div class="site-content">

  <h1>Contact</h1>

   <form>
        <label style="font-size:14px;">Name</label><br>
        <input type="text" style="width:100%; padding:12px; margin:8px 0 18px; border:1px solid #ddd; border-radius:8px;">

        <label style="font-size:14px;">Email</label><br>
        <input type="email" style="width:100%; padding:12px; margin:8px 0 18px; border:1px solid #ddd; border-radius:8px;">

        <label style="font-size:14px;">Message</label><br>
        <textarea rows="5" style="width:100%; padding:12px; margin:8px 0 18px; border:1px solid #ddd; border-radius:8px;"></textarea>

        <button type="submit"
          style="width:100%; padding:14px; background:#111; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer;">
          Send Message
        </button>
      </form>

</div>

<footer style="text-align:center;padding:30px;background:#111;color:#fff;margin-top:40px;">
  <p>Overland Park, KS, USA | contactus@sbskcmo.com</p>
  <p>© 2026 Small Business Solutions</p>
</footer>

</div>

</body>
</html>
