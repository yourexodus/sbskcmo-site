<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact – Small Business Solutions</title>

<base href="https://yourexodus.github.io/sbskcmo-site/">

<link rel="stylesheet" href="wp-content/themes/astra/assets/css/minified/style.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700|Montserrat:700&display=fallback">

<style>
body {
  font-family: 'Noto Sans', sans-serif;
  margin: 0;
}

.site-header {
  padding: 20px;
  background: #fff;
  border-bottom: 1px solid #eee;
}

.site-branding {
  display: flex;
  align-items: center;
  gap: 15px;
}

.main-nav a {
  margin-right: 15px;
  text-decoration: none;
  color: #000;
}

.site-content {
  padding: 40px 20px;
  max-width: 900px;
  margin: auto;
}

.wpcf7-form input,
.wpcf7-form textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0 15px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

.wpcf7-submit {
  background: #000;
  color: #fff;
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
}
</style>

</head>

<body>

<div id="page">

<header class="site-header">
  <div class="site-branding">
    <a href="">
      <img src="wp-content/uploads/2019/11/cropped-logo-126x118.png" style="max-width:120px;">
    </a>

    <div>
      <h2>Small Business Solutions</h2>
      <p>Experts in Data Collection, Report Generation, and Sales Training</p>
    </div>
  </div>

  <nav class="main-nav">
    <a href="">Home</a>
    <a href="about/">About</a>
    <a href="services/">Services</a>
    <a href="projects/">Projects</a>
    <a href="who-we-are/">Who We Are</a>
    <a href="contact/">Contact</a>
  </nav>
</header>

<div class="site-content">

  <h1>Contact</h1>

  <form action="https://formspree.io/f/sbskcmo.com@gmail.com" method="POST" class="wpcf7-form">

    <label>Name</label>
    <input type="text" name="name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Subject</label>
    <input type="text" name="subject">

    <label>Message</label>
    <textarea name="message" rows="6" required></textarea>

    <button type="submit" class="wpcf7-submit">Send</button>

  </form>

</div>

<footer style="text-align:center;padding:30px;background:#111;color:#fff;margin-top:40px;">
  <p>Overland Park, KS, USA | contactus@sbskcmo.com</p>
  <p>© 2026 Small Business Solutions</p>
</footer>

</div>

</body>
</html>
